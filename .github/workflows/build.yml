name: Build and Deploy

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [brain-updated]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: write-all
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout Weh-Workbench
        uses: actions/checkout@v4
        with:
          path: Weh-Workbench
          fetch-depth: 0

      - name: Checkout Weh-Brain (private)
        uses: actions/checkout@v4
        with:
          repository: WenXue-10/Weh-Brain
          path: Weh-Brain
          token: ${{ secrets.WEH_BRAIN_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install markdown pillow

      - name: Build site
        run: |
          cd Weh-Workbench
          WEH_BRAIN_ROOT=../Weh-Brain python build_site.py

      - name: Commit and push
        run: |
          cd Weh-Workbench
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "[自动构建] 更新知识库内容 $(date +'%Y-%m-%d %H:%M')"
            git push
          fi
